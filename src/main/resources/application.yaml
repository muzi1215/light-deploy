server:
  port: 2027
  servlet:
    # 所有接口统一挂载在 /deploy 下，Nginx 反向代理时需要保留该上下文路径。
    context-path: /deploy

spring:
  application:
    # 应用名称，同时用于 Spring 运行日志和监控识别。
    name: light-deploy

  # 数据库连接配置。schema.sql 和 cleanup.sql 都是手工数据库脚本，应用启动不会自动执行。
  sql:
    init:
      # never：禁止 Spring Boot 启动时执行 classpath 下的 schema.sql/data.sql。
      # always 初始化 classpath 下的 schema.sql/data.sql。
      # 如需初始化数据库，请先备份，再使用 mysql 命令手工执行对应脚本。
      mode: never
  datasource:
    # MySQL JDBC 驱动和连接地址。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/deploy?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT
    # 实际部署时建议通过环境变量或外部配置覆盖，不要把生产密码提交到 Git。
    username: root
    password: sasa

  data:
    redis:
      # Redis 用于任务状态、分布式锁和实时进度，不作为业务数据唯一存储。
      host: 127.0.0.1
      #host: 192.168.126.115
      port: 6379
      #    host: 127.0.0.1
      #    port: 6379
      database: 0
      timeout: 18000
      password:
      jedis:
        pool:
          max-active: 20 #最大连接数
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 5    #最大空闲
          min-idle: 0     #最小空闲

mybatis-plus:
  # XML Mapper 文件和实体类型别名扫描路径。
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.lx.deploy.**.model
  configuration:
    # 将数据库下划线字段自动映射为 Java 驼峰属性。
    map-underscore-to-camel-case: true
    # 关闭二级缓存，任务和部署状态以 MySQL/Redis 的明确读写为准。
    cache-enabled: false
    # 查询结果中的 NULL 字段也执行 setter，保持对象结构稳定。
    call-setters-on-nulls: true
  global-config:
    # 关闭 MyBatis-Plus 启动横幅。
    banner: false
    db-config:
      # 使用 32 位 UUID 字符串作为主键，由 BaseEntity 统一定义。
      id-type: assign_uuid
      # 逻辑删除字段配置，删除操作只更新 is_deleted，不物理删除数据。
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 开启下划线命名约定。
      table-underline: true

logging:
  level:
    # 业务包默认记录 INFO 及以上级别，文件落盘规则由 logback-spring.xml 控制。
    com.lx.deploy: info

light-deploy:
  crypto:
    # AES-256 密钥必须是 Base64 编码后解码为32字节的随机密钥。
    # 只从环境变量注入，禁止将真实密钥写入 application.yaml 或提交到 Git。
    # aes-key: ${LIGHT_DEPLOY_AES_KEY:}
    aes-key: sCiAhDKE1xzqkAXnMECqPLvrFE3w7G2dqXSJPOffEOE=
#  task:
#    # 任务线程池基础并发配置，当前基线支持至少 6 台服务器并发调度。
#    core-pool-size: 6
#    max-pool-size: 6
#    queue-capacity: 20
