server:
  port: 2027
  servlet:
    # 所有接口统一挂载在 /deploy 下，Nginx 反向代理时需要保留该上下文路径。
    context-path: /deploy

spring:
  profiles:
    active:
      - dev
  servlet:
    # 产物上传上限：前端 dist 打包后常见几十 MB，Spring Boot 默认单文件 1MB 会直接拒绝。
    # 平台自身是内网运维系统，上限放宽到 500MB；真正的边界由网关与磁盘空间决定。
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    # 应用名称，同时用于 Spring 运行日志和监控识别。
    name: light-deploy

  # 数据库连接配置。schema.sql 和 cleanup.sql 都是手工数据库脚本，应用启动不会自动执行。
  sql:
    init:
      # never：禁止 Spring Boot 启动时执行 classpath 下的 schema.sql/data.sql。
      # always 初始化 classpath 下的 schema.sql/data.sql。
      # 如需初始化数据库，请先备份，再使用 mysql 命令手工执行对应脚本。
      mode: never
  datasource:
    # MySQL JDBC 驱动和连接地址。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/deploy?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT
    # 实际部署时建议通过环境变量或外部配置覆盖，不要把生产密码提交到 Git。
    username: root
    password: sasa

  data:
    redis:
      # Redis 用于任务状态、分布式锁和实时进度，不作为业务数据唯一存储。
      host: 127.0.0.1
      #host: 192.168.126.115
      port: 6379
      #    host: 127.0.0.1
      #    port: 6379
      database: 0
      timeout: 18000
      password:
      jedis:
        pool:
          max-active: 20 #最大连接数
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 5    #最大空闲
          min-idle: 0     #最小空闲

mybatis-plus:
  # XML Mapper 文件和实体类型别名扫描路径。
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.lx.deploy.**.model
  configuration:
    # 将数据库下划线字段自动映射为 Java 驼峰属性。
    map-underscore-to-camel-case: true
    # 关闭二级缓存，任务和部署状态以 MySQL/Redis 的明确读写为准。
    cache-enabled: false
    # 查询结果中的 NULL 字段也执行 setter，保持对象结构稳定。
    call-setters-on-nulls: true
  global-config:
    # 关闭 MyBatis-Plus 启动横幅。
    banner: false
    db-config:
      # 使用 32 位 UUID 字符串作为主键，由 BaseEntity 统一定义。
      id-type: assign_uuid
      # 逻辑删除字段配置，删除操作只更新 is_deleted，不物理删除数据。
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 开启下划线命名约定。
      table-underline: true

logging:
  level:
    # 业务包默认记录 INFO 及以上级别，文件落盘规则由 logback-spring.xml 控制。
    com.lx.deploy: info

light-deploy:
  # 操作日志里「应用系统」列的取值（见 AGENTS.md §26.3）。
  # 一个平台实例只对应一个系统名，属于系统级事实而非接口级事实，
  # 因此配在这里由切面统一写入 audit_log.application，而不是在每个 @OperLog 注解上重复写一遍
  # （28 个接口各写一次，改名时要改 28 处，且必然漏）。改名只改这一行即可，历史记录不受影响。
  application-name: 轻量部署发布系统

  # 访问日志参数（见 AGENTS.md §14.2）。
  access-log:
    # 静默路径前缀（不含 server.servlet.context-path 的 /deploy）：
    # 命中且响应码 < 400 时降为 DEBUG，>= 400 仍记 WARN，保住接口出错与任务不存在这类线索。
    # 前端日志查看器每 1.5 秒轮询一次 /taskLog/pull，不静默会把 info.log 刷满；
    # 后续新增轮询接口时加在这里即可，不必改代码。
    silent-paths:
      - /taskLog/pull

  crypto:
    # AES-256 密钥必须是 Base64 编码后解码为32字节的随机密钥。
    # 只从环境变量注入，禁止将真实密钥写入 application.yaml 或提交到 Git。
    # aes-key: ${LIGHT_DEPLOY_AES_KEY:}，sCiAhDKE1xzqkAXnMECqPLvrFE3w7G2dqXSJPOffEOE=
    aes-key: sCiAhDKE1xzqkAXnMECqPLvrFE3w7G2dqXSJPOffEOE=

  # SSH 执行层参数。只影响建立连接与执行远程命令的等待时长，不涉及凭据本身。
  ssh:
    # TCP 建连等待时间（毫秒），目标机网络不通时据此快速失败。
    connect-timeout-ms: 10000
    # SSH 认证等待时间（毫秒），密码或私钥校验的等待上限。
    auth-timeout-ms: 10000
    # 单条远程命令的等待时间（秒）；探活、检目录、systemctl 这类秒级命令用它。
    command-timeout-seconds: 120
    # 耗时类命令（克隆仓库、构建、镜像构建/推送、发布）的等待时间（秒）。
    # 首次构建要从仓库下载上百 MB 依赖，分钟级属于正常，用 120 秒会把它误判成卡死。
    long-command-timeout-seconds: 1800
    # 单条命令输出保留的最大字符数，超出部分截断，避免大输出撑爆内存与日志。
    max-output-chars: 20000

  # 任务执行器参数。
  task:
    # 并发执行上限，等于线程池大小；AGENTS.md §1 的 6 台服务器基线据此设置。
    pool-size: 6
    # 排队任务轮询间隔（毫秒）。
    poll-interval-ms: 1000
    # 单次轮询最多领取的任务数。
    poll-batch-size: 20
    # 任务日志是否同步打印到服务端控制台与 info.log（带 taskId 与阶段前缀）。
    # 关闭后任务日志只在平台页面可见；构建类任务输出行多，日志量敏感时可设为 false。
    log-echo-enabled: true

  # 构建模块参数（专用构建机方案）。
  # 注意：构建工作区目录、构建产物持久目录、各机器的部署根目录都已下沉为 server 表的列，
  # 在服务器页面按机器维护（默认值由数据库列的 DEFAULT 定义），本文件不再提供这些路径配置。
  build:
    # 默认构建机服务器 ID：留空则每次构建请求必须显式指定 buildServerId。
    # 生产环境建议在外部配置或环境变量中设置，不把真实服务器 ID 提交到 Git。
    server-id: 908f73d91848486bade3d3bf1654dff0

  # AIops 联动（发布静默窗 + 发布事件上报）。整套能力默认关闭：
  # enabled=false 时所有联动逻辑直接短路，不建窗、不推事件、不注册定时任务，
  # 平台行为与接入前完全一致。没部署 AIops 的环境无需关心这一段。
  aiops:
    enabled: true
    # AIops 服务地址（AIops 默认 2029 端口）。
    base-url: http://127.0.0.1:2029
    # 平台调 AIops 时出示的令牌，必须与 AIops 侧 DEPLOY_OPENAPI_TOKEN 一致。
    # 只从环境变量注入，禁止把真实令牌写进本文件并提交到 Git。
    service-token: light-deploy-aiops-token
    # 调用方标识，AIops 侧按它做 X-Service-Id 白名单校验。
    service-id: light-deploy
    # 建连/读取超时（毫秒）。AIops 在内网，建连失败要快速暴露，不能拖住发布线程。
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 事件推送失败的重试上限与退避扫描间隔。
    retry-max: 5
    retry-interval-seconds: 30
    # 事件有效期（小时）：发布结束太久之后再补发只会污染对方的告警归因时序。
    expire-hours: 2
    # 建静默窗失败时是否继续发布。true=继续（默认，AIops 挂了不能连带发不了版）；
    # 只有「发布必须留痕」的严格环境才设为 false 阻断发布。
    fail-open: true
    # 静默窗基准时长（分钟），平台按「基准 + 每台目标 3 分钟余量」估算，上限 120 分钟（与 AIops 硬上限一致）。
    silence-ttl-minutes: 40
    # 需要静默的告警类型，取值沿用 AIops 的 alarm_type_name，避免两套词汇表互相翻译。
    alert-categories:
      - 服务异常
    # 显式声明永不静默的类型（AIops 侧另有硬编码底线，此处只是把口径写明）。
    never-silence:
      - 系统资源
      - 内核
      - 网络
      - MySQL连接池
      - MySQL慢查询
