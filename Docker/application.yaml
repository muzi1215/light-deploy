# ==================== Light Deploy · 容器环境配置覆盖 ====================
# 挂载到容器内 /app/application.yaml（见 docker-compose.yml）。
#
# 【只写与容器环境不同的键】
# Spring Boot 的默认配置位置包含 `optional:file:./`，WORKDIR=/app 时本文件会被自动加载，
# 且优先级高于 jar 内 classpath:/application.yaml。加载是**按属性**覆盖，不是整文件替换：
# 这里没写的键（mybatis-plus、ssh 超时、task 线程数、aiops 告警类型…）继续沿用 jar 内配置。
# 所以本文件要保持「最小差异」，不要整份复制 src/main/resources/application.yaml，
# 否则两边会各自漂移，改了仓库配置容器里不生效也看不出来。
#
# 改完生效方式：docker compose restart light-deploy（不需要 --build）。
# =====================================================================

server:

  # 与 jar 内一致，写出来是为了让 compose 的 "2027:2027" 端口映射有据可查。
  # 改端口必须同时改 compose 的 ports，否则宿主机连到的是空端口。
  port: 2027
  servlet:
    context-path: /deploy

spring:
  profiles:
    active:
      - prod
  servlet:
    # 产物上传上限：前端 dist 打包后常见几十 MB，Spring Boot 默认单文件 1MB 会直接拒绝。
    # 平台自身是内网运维系统，上限放宽到 500MB；真正的边界由网关与磁盘空间决定。
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    # 容器内 127.0.0.1 = 容器自己，必须换成宿主机入口。
    # 名称 host.docker.internal 由 compose 的 extra_hosts: host-gateway 提供。
    # MySQL 也在 lx-app-net 里跑容器时，换成容器名更快（少一层 NAT）：
    #   jdbc:mysql://mysql:3306/deploy?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://host.docker.internal:3306/deploy?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT
    username: lx
    # 生产建议改成宿主机 .env 注入。注意别在 compose 里写 ${DB_PASSWORD:-}：
    # 变量存在但为空字符串时，Spring 的 ${DB_PASSWORD:默认值} **不会**回落到默认值，会直接拿空串去连库。
    password: lx_relife

  data:
    redis:
      # 同上：容器内不能用 127.0.0.1。Redis 也在 lx-app-net 时改 redis://redis:6379 对应的 host: redis。
      host: host.docker.internal
      port: 6379
      password: lx2026
      database: 0
      timeout: 18000
      jedis:
        pool:
          max-active: 20 #最大连接数
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 5    #最大空闲
          min-idle: 0     #最小空闲

light-deploy:
  # 操作日志里「应用系统」列的取值（见 AGENTS.md §26.3）。
  # 一个平台实例只对应一个系统名，属于系统级事实而非接口级事实，
  # 因此配在这里由切面统一写入 audit_log.application，而不是在每个 @OperLog 注解上重复写一遍
  # （28 个接口各写一次，改名时要改 28 处，且必然漏）。改名只改这一行即可，历史记录不受影响。
  application-name: 轻量部署发布系统

  # 访问日志参数（见 AGENTS.md §14.2）。
  access-log:
    # 静默路径前缀（不含 server.servlet.context-path 的 /deploy）：
    # 命中且响应码 < 400 时降为 DEBUG，>= 400 仍记 WARN，保住接口出错与任务不存在这类线索。
    # 前端日志查看器每 1.5 秒轮询一次 /taskLog/pull，不静默会把 info.log 刷满；
    # 后续新增轮询接口时加在这里即可，不必改代码。
    silent-paths:
      - /taskLog/pull

  crypto:
    # AES-256 密钥必须是 Base64 编码后解码为32字节的随机密钥。
    # 只从环境变量注入，禁止将真实密钥写入 application.yaml 或提交到 Git。
    # aes-key: ${LIGHT_DEPLOY_AES_KEY:}
    aes-key: sCiAhDKE1xzqkAXnMECqPLvrFE3w7G2dqXSJPOffEOE=

  # SSH 执行层参数。只影响建立连接与执行远程命令的等待时长，不涉及凭据本身。
  ssh:
    # TCP 建连等待时间（毫秒），目标机网络不通时据此快速失败。
    connect-timeout-ms: 10000
    # SSH 认证等待时间（毫秒），密码或私钥校验的等待上限。
    auth-timeout-ms: 10000
    # 单条远程命令的等待时间（秒）；探活、检目录、systemctl 这类秒级命令用它。
    command-timeout-seconds: 120
    # 耗时类命令（克隆仓库、构建、镜像构建/推送、发布）的等待时间（秒）。
    # 首次构建要从仓库下载上百 MB 依赖，分钟级属于正常，用 120 秒会把它误判成卡死。
    long-command-timeout-seconds: 1800
    # 单条命令输出保留的最大字符数，超出部分截断，避免大输出撑爆内存与日志。
    max-output-chars: 20000

  # 任务执行器参数。
  task:
    # 并发执行上限，等于线程池大小；AGENTS.md §1 的 6 台服务器基线据此设置。
    pool-size: 6
    # 排队任务轮询间隔（毫秒）。
    poll-interval-ms: 1000
    # 单次轮询最多领取的任务数。
    poll-batch-size: 20
    # 任务日志是否同步打印到服务端控制台与 info.log（带 taskId 与阶段前缀）。
    # 关闭后任务日志只在平台页面可见；构建类任务输出行多，日志量敏感时可设为 false。
    log-echo-enabled: true

  # 构建模块参数（专用构建机方案）。
  # 注意：构建工作区目录、构建产物持久目录、各机器的部署根目录都已下沉为 server 表的列，
  # 在服务器页面按机器维护（默认值由数据库列的 DEFAULT 定义），本文件不再提供这些路径配置。
  build:
    # 默认构建机服务器 ID：留空则每次构建请求必须显式指定 buildServerId。
    # 生产环境建议在外部配置或环境变量中设置，不把真实服务器 ID 提交到 Git。
    server-id: 908f73d91848486bade3d3bf1654dff0

  aiops:
    enabled: true
    # 平台调 AIops 的地址：容器内不能用 127.0.0.1（那是指平台自己）。
    # AIops 的后端容器在 lx-app-net 里名叫 aiops-backend（见 aiops-platform/Docker/docker-compose-prod.yml），
    # 同一网络内直接用容器名 + 容器端口，不经过宿主机端口映射。
    # AIops 裸跑在宿主机时改回：http://host.docker.internal:2029
    base-url: http://aiops-backend:2029
    # 必须与 AIops 侧 .env 的 DEPLOY_OPENAPI_TOKEN 完全一致，否则所有联动请求 401，
    # 而平台侧只会在任务日志打【注意】降级（fail-open），发布照样成功——很难发现，改动时两边一起改。
    service-token: light-deploy-aiops-token
    # 必须出现在 AIops 侧 DEPLOY_OPENAPI_SERVICE_IDS 白名单里（默认含 light-deploy）。
    service-id: light-deploy
    # 建连/读取超时（毫秒）。AIops 在内网，建连失败要快速暴露，不能拖住发布线程。
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 事件推送失败的重试上限与退避扫描间隔。
    retry-max: 5
    retry-interval-seconds: 30
    # 事件有效期（小时）：发布结束太久之后再补发只会污染对方的告警归因时序。
    expire-hours: 2
    # 建静默窗失败时是否继续发布。true=继续（默认，AIops 挂了不能连带发不了版）；
    # 只有「发布必须留痕」的严格环境才设为 false 阻断发布。
    fail-open: true
    # 静默窗基准时长（分钟），平台按「基准 + 每台目标 3 分钟余量」估算，上限 120 分钟（与 AIops 硬上限一致）。
    silence-ttl-minutes: 40
    # 需要静默的告警类型，取值沿用 AIops 的 alarm_type_name，避免两套词汇表互相翻译。
    alert-categories:
      - 服务异常
    # 显式声明永不静默的类型（AIops 侧另有硬编码底线，此处只是把口径写明）。
    never-silence:
      - 系统资源
      - 内核
      - 网络
      - MySQL连接池
      - MySQL慢查询
  # crypto.aes-key 故意不在这里覆盖：
  # 数据库里已存的服务器密码/私钥是用 jar 内那把 key 加密的，换 key 会让历史凭据全部解不开
  # （表现为「服务器密码为空」「SSH 认证失败」）。要轮换必须走「改配置 + 重新录入凭据」的完整流程。
  #
  # 另外提醒一个当前仓库的现状：README 写的是「用环境变量 LIGHT_DEPLOY_AES_KEY 注入」，
  # 但 src/main/resources/application.yaml 里 `aes-key` 是**字面量**（环境变量占位那行被注释掉了），
  # 所以现在设环境变量并不生效。要让环境变量真正生效，得先把那一行改成
  #   aes-key: ${LIGHT_DEPLOY_AES_KEY:现有那把密钥}
  # 再在这里保持不覆盖（带默认值是为了「没设变量也能起来」）。
